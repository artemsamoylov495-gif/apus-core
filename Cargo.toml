[package]
name = "apus-core"
version = "0.75.0"
edition = "2021"

[dependencies]
open = "5.0"
tokio = { version = "1.35", features = ["full"] }
axum = { version = "0.7", features = ["multipart", "ws"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["fs", "cors"] }
chacha20poly1305 = "0.10"
uuid = { version = "1.6", features = ["v4"] }
sha2 = "0.11"
reqwest = { version = "0.11", features = ["json"] }
sysinfo = "0.30"
rand = "0.8"
# Подтягиваем tray-item БЕЗ linux-зависимостей при кросс-компиляции
[target.'cfg(target_os = "windows")'.dependencies]
tray-item = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
tray-item = { version = "0.8", features = ["ksni"] }

[[bin]]
name = "apus-core"
path = "src/main.rs"

[[bin]]
name = "apus-corp"
path = "src/bin/corp.rs"

[[bin]]
name = "apus-mesh"
path = "src/bin/mesh.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
